server:
  port: 8083

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:orderdb}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: order-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.surya.fooddelivery.events

  cloud:
    openfeign:
      circuitbreaker:
        # Wrap every Feign call in a circuit breaker so a slow/dead dependency
        # cannot exhaust this service's threads.
        enabled: true

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50          # open after 50% of calls fail
        waitDurationInOpenState: 10s      # then probe again
        permittedNumberOfCallsInHalfOpenState: 3
    instances:
      user-service:
        baseConfig: default
      restaurant-service:
        baseConfig: default
  timelimiter:
    configs:
      default:
        timeoutDuration: 3s

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers
  health:
    circuitbreakers:
      enabled: true

security:
  jwt:
    # Verification only — this service never signs anything. Must match the value auth-service
    # signs with; a mismatch shows up as every request failing with 401.
    secret: ${JWT_SECRET:dev-only-jwt-secret-change-me-before-deploying-anywhere}
    issuer: food-delivery-auth
