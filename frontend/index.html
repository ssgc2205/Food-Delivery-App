<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Delivery</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍜</text></svg>">

    <!--
      Runtime configuration, loaded before the app.

      This is a plain script (not a module) on purpose: it is the one file that differs between
      environments, and the Docker image overwrites it at build time to point at the nginx proxy
      instead of a hard-coded port. Keeping it separate means the SAME application files run
      locally and in a container — nothing about the API location is baked into the app itself.
    -->
    <script src="env.js"></script>
</head>
<body>

<div id="app">
    <header class="topbar">
        <a class="brand" href="#/restaurants">
            <span class="brand-mark">🍜</span>
            <span>Food Delivery</span>
        </a>

        <nav id="nav" class="nav"></nav>

        <div id="account" class="account"></div>
    </header>

    <main id="view" class="view">
        <!-- Views render here -->
    </main>

    <footer class="footer">
        <span>Spring Boot microservices demo</span>
        <span class="dot">·</span>
        <a href="/swagger-ui.html" target="_blank" rel="noreferrer">API docs</a>
        <span class="dot">·</span>
        <span id="api-target" class="muted"></span>
    </footer>
</div>

<div id="toasts" class="toasts" aria-live="polite"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
