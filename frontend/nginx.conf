server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ------------------------------------------------------------------------
    # Static files
    # ------------------------------------------------------------------------

    location / {
        # Hash routing means the browser never asks the server for /orders — everything after
        # the "#" stays client-side — so a plain file lookup is enough. The fallback covers
        # someone typing a path directly.
        try_files $uri $uri/ /index.html;
    }

    # The one file that differs per environment must never be cached, or a browser will keep
    # pointing at the previous environment's API after a redeploy.
    location = /env.js {
        add_header Cache-Control "no-store";
    }

    # ------------------------------------------------------------------------
    # API proxy — the reason there is no CORS configuration to get wrong
    # ------------------------------------------------------------------------
    #
    # The browser only ever talks to THIS origin. Requests to /api/... are forwarded to the
    # gateway server-side, so as far as the browser is concerned there is no cross-origin
    # request at all: no preflight, no Access-Control-Allow-Origin headers, nothing to
    # misconfigure. Same trick for /swagger-ui.html and /docs.

    location /api/ {
        proxy_pass http://api-gateway:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Authorization must survive the hop, or every request arrives unauthenticated.
        proxy_pass_request_headers on;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    location /swagger-ui { proxy_pass http://api-gateway:8080; }
    location = /swagger-ui.html { proxy_pass http://api-gateway:8080; }
    location /v3/api-docs { proxy_pass http://api-gateway:8080; }
    location /docs/ { proxy_pass http://api-gateway:8080; }

    # ------------------------------------------------------------------------
    # Basic hardening
    # ------------------------------------------------------------------------

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "DENY"    always;
    add_header Referrer-Policy        "no-referrer" always;

    gzip on;
    gzip_types text/css application/javascript application/json;
}
