name: food-delivery

x-service-env: &service-env
  EUREKA_HOST: discovery-server
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  KAFKA_BOOTSTRAP: kafka:9092
  # One signing key shared by every container: auth-service signs tokens with it, everyone
  # else verifies against it. Defined in the shared anchor precisely so the values cannot
  # drift apart — a mismatch would show up as every request failing with a confusing 401.
  # Override it for anything that is not local development:  JWT_SECRET=... docker compose up
  JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-change-me-before-deploying-anywhere}

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12

  discovery-server:
    build:
      context: .
      dockerfile: discovery-server/Dockerfile
    environment:
      EUREKA_HOST: discovery-server
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    environment:
      <<: *service-env
    ports:
      - "8080:8080"
    depends_on:
      discovery-server:
        condition: service_healthy

  # The web UI. nginx serves the static files AND reverse-proxies /api to the gateway, so the
  # browser only ever sees one origin — which is why there is no CORS configuration in play here.
  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - api-gateway

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    environment:
      <<: *service-env
      POSTGRES_DB: authdb
      # Creates the first administrator on an empty database, since granting the ADMIN role
      # otherwise requires already holding it. Turn this off outside local development.
      BOOTSTRAP_ADMIN_ENABLED: "true"
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-admin12345}
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_healthy

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    environment:
      <<: *service-env
      POSTGRES_DB: userdb
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_healthy

  restaurant-service:
    build:
      context: .
      dockerfile: restaurant-service/Dockerfile
    environment:
      <<: *service-env
      POSTGRES_DB: restaurantdb
    depends_on:
      postgres:
        condition: service_healthy
      discovery-server:
        condition: service_healthy

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    environment:
      <<: *service-env
      POSTGRES_DB: orderdb
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      discovery-server:
        condition: service_healthy

  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    environment:
      <<: *service-env
      POSTGRES_DB: paymentdb
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      discovery-server:
        condition: service_healthy

  delivery-service:
    build:
      context: .
      dockerfile: delivery-service/Dockerfile
    environment:
      <<: *service-env
      POSTGRES_DB: deliverydb
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      discovery-server:
        condition: service_healthy

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    environment:
      <<: *service-env
    depends_on:
      kafka:
        condition: service_healthy
      discovery-server:
        condition: service_healthy

volumes:
  postgres-data:
